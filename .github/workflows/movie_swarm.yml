name: Distributed Dynamic Movie Swarm

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

jobs:
  render_dynamic_reels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_id: [1, 2]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 与 FFmpeg 环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install --upgrade google-genai pillow requests

      - name: 启动抢单渲染进程
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIRECTOR_API_URL: ${{ secrets.DIRECTOR_API_URL }}
        run: |
          python3 - << 'RUNNER'
          import os, sys, json, time, requests
          from google import genai
          from google.genai import types

          API_URL = os.environ.get("DIRECTOR_API_URL", "").rstrip("/")
          KEY = os.environ.get("GEMINI_API_KEY", "")
          if not API_URL or not KEY:
              sys.exit(0)

          client = genai.Client(api_key=KEY)
          try:
              res = requests.get(f"{API_URL}/api/get_task", timeout=15)
              task = res.json()
              if task.get("status") == "assigned":
                  shot = task["shot"]
                  sid = shot["shot_id"]
                  print(f"🎬 GitHub 节点接单: {sid}")
                  prompt = f"{task.get('art_style_anchor')}. {shot.get('prompt')}. Fluid physical motion, 4k cinematic."
                  op = client.models.generate_videos(
                      model='veo-2.0-generate-001',
                      prompt=prompt,
                      config=types.GenerateVideosConfig(aspect_ratio="16:9", person_generation="allow_adult")
                  )
                  while not op.done:
                      time.sleep(12)
                      op = client.operations.get(op)
                  if op.result and op.result.generated_videos:
                      requests.post(f"{API_URL}/api/report_shot", json={"shot_id": sid}, timeout=10)
                      print(f"🎉 镜头 {sid} 生成并上报完毕！")
          except Exception as e:
              print(f"Swarm Error: {e}")
          RUNNER
