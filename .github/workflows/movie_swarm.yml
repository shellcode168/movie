name: Distributed Dynamic Movie Swarm (Multi-Node)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  swarm_workers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_id: [1, 2, 3, 4]

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 与 FFmpeg 渲染环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install --upgrade google-genai pillow requests

      - name: 启动多节点透视抢单渲染
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIRECTOR_API_URL: ${{ secrets.DIRECTOR_API_URL }}
          NODE_ID: ${{ matrix.node_id }}
        run: |
          python3 - << 'RUNNER'
          import os, sys, json, time, random, requests
          from google import genai
          from google.genai import types

          API_URL = os.environ.get("DIRECTOR_API_URL", "").rstrip("/")
          KEY = os.environ.get("GEMINI_API_KEY", "")
          NODE_ID = os.environ.get("NODE_ID", "1")

          if not API_URL or not KEY:
              print(f"❌ [节点 #{NODE_ID}] 缺少必要环境变量 DIRECTOR_API_URL 或 GEMINI_API_KEY，退出。")
              sys.exit(0)

          client = genai.Client(api_key=KEY)
          print(f"================================================================")
          print(f"🛰️ [集群节点 #{NODE_ID}] 算力机上线，连接总导演: {API_URL}")
          print(f"================================================================")

          # 错开启动时间，避免瞬时竞争
          delay = random.randint(2, 8)
          print(f"⏱️ [节点 #{NODE_ID}] 为防撞车，错峰缓冲 {delay} 秒后发起任务抢夺...")
          time.sleep(delay)

          while True:
              try:
                  print(f"🔍 [节点 #{NODE_ID}] 正在向中枢请求空闲镜头任务...")
                  res = requests.get(f"{API_URL}/api/get_task", timeout=15)
                  if res.status_code != 200:
                      print(f"⚠️ [节点 #{NODE_ID}] 中枢通信状态码 {res.status_code}，休眠 15 秒...")
                      time.sleep(15)
                      continue

                  task = res.json()
                  status = task.get("status")

                  if status == "empty":
                      print(f"⏳ [节点 #{NODE_ID}] 总导演正在撰写新电影剧本，休眠 20 秒...")
                      time.sleep(20)
                      continue
                  elif status == "completed":
                      film_title = task.get("film_title", "本片")
                      print(f"🎉 [节点 #{NODE_ID}] 电影《{film_title}》所有镜头已完结，无待渲染任务，安全休眠。")
                      break
                  elif status != "assigned":
                      print(f"ℹ️ [节点 #{NODE_ID}] 当前无任务分配，状态: {status}，等待 10 秒...")
                      time.sleep(10)
                      continue

                  film_title = task.get("film_title", "未命名大片")
                  chapter_id = task.get("chapter_id", 1)
                  shot = task["shot"]
                  sid = shot.get("shot_id", "未知镜")
                  prompt = shot.get("prompt", "")
                  dur = shot.get("duration", 8)
                  is_climax = "💥[高潮重头戏]" if shot.get("is_climax") else "🎬[常规过渡镜]"

                  tag = f"节点#{NODE_ID} | 《{film_title}》第 {chapter_id} 章 | 镜头 {sid}"

                  print(f"\n🎬 ============================================================")
                  print(f"🎬 成功抢单: {tag} {is_climax}")
                  print(f"   动作描述: {prompt}")
                  print(f"   镜头时长: {dur} 秒")
                  print(f"================================================================")

                  # 提交 Veo 2.0 任务
                  print(f"   📡 [{tag}] 正在向 Veo 2.0 提交渲染请求...")
                  full_prompt = (
                      f"{task.get('art_style_anchor')}. {prompt}. "
                      "Fluid physical movement, cinematic lighting, realistic camera motion, 4k resolution, zero static frames."
                  )

                  operation = client.models.generate_videos(
                      model='veo-2.0-generate-001',
                      prompt=full_prompt,
                      config=types.GenerateVideosConfig(aspect_ratio="16:9", person_generation="allow_adult")
                  )

                  print(f"   ⏳ [{tag}] Veo 视频生成中，进入轮询等待...")
                  elapsed = 0
                  while not operation.done:
                      time.sleep(12)
                      elapsed += 12
                      print(f"      -> [{tag}] 动态物理轨迹计算中... (已耗时 {elapsed}s)")
                      operation = client.operations.get(operation)

                  if operation.result and operation.result.generated_videos:
                      print(f"   ✅ [{tag}] 视频生成完毕，正在向总导演上报归档...")
                      report_res = requests.post(
                          f"{API_URL}/api/report_shot",
                          json={"shot_id": sid},
                          timeout=15
                      )
                      print(f"   🎉 [{tag}] 镜头上报成功，已标记为 rendered！\n")

                  time.sleep(5)

              except Exception as e:
                  print(f"❌ [节点 #{NODE_ID} 异常] {repr(e)}")
                  time.sleep(15)
          RUNNER
